app:
  android:
    flavorDimensions: "flavor-type"

flavors:
  development:
    app:
      name: "Pitchside Dev"
    android:
      applicationId: "com.zorixsolutions.arana.dev"
      firebase:
        config: "assets/firebase/development/google-services.json"
    ios:
      bundleId: "com.zorixsolutions.arana.dev"
      firebase:
        config: "assets/firebase/development/GoogleService-Info.plist"

  production:
    app:
      name: "Pitchside"
    android:
      applicationId: "com.zorixsolutions.arana"
      firebase:
        config: "assets/firebase/production/google-services.json"
    ios:
      bundleId: "com.zorixsolutions.arana"
      firebase:
        config: "assets/firebase/production/GoogleService-Info.plist"

ide: vscode

instructions:
  # Native flavors only. One lib/main.dart; API URL comes from config.*.json.
  # Do not run flutter:flavors, flutter:app, or icon processors.
  - ios:xcconfig
  - ios:buildTargets
  - ios:schema
  - ios:plist
  - android:androidManifest
  - android:buildGradle
  - android:flavorizrGradle
  - google:firebase
